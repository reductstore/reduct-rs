name: ci
on:
  push:
    branches: [ main, stable ]
    tags:
      - 'v*'
    paths-ignore:
      - docs/**
      - README.md
      - CHANGELOG.md

  pull_request:
    branches: [ main, stable ]
    paths-ignore:
      - docs/**
      - README.md
      - CHANGELOG.md

permissions: read-all

env:
  REGISTRY_IMAGE: reduct/store
  MINIMAL_RUST_VERSION: ${{ vars.MINIMAL_RUST_VERSION }}

jobs:
  rust_fmt:
    runs-on: ubuntu-latest
    name: Rust Linter
    steps:
      - uses: actions/checkout@v5
      - name: Check code
        run: cargo fmt --all -- --check


  sdk_tests:
    name: Client SDK Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        reductstore_version: [ "main", "latest" ]
        include:
          - reductstore_version: main
            features: "default,test-api-121"
          - reductstore_version: latest
            features: "default"
    needs:
      - rust_fmt
    steps:
      - uses: actions/checkout@v5
      - name: Generate license
        run: echo '${{secrets.LICENSE_KEY}}' > lic.key
      - name: Run Database
        run: docker run --network=host -v ${PWD}/misc:/misc
          --env RS_API_TOKEN=TOKEN
          --env RS_EXT_PATH=/tmp
          --env RS_LICENSE_PATH=/misc/lic.key -d reduct/store:${{ matrix.reductstore_version }}

      - name: AWS Credentials and Cargo Cache
        uses: ./.github/actions/aws-cargo-cache
        with:
          target: x86_64-unknown-linux-gnu
          profile: ci
          access-key-id: ${{ secrets.S3_CACHE_ACCESS_KEY }}
          secret-access-key: ${{ secrets.S3_CACHE_SECRET_KEY }}

      - name: Run Client SDK tests
        run: RS_API_TOKEN=TOKEN cargo test --features ${{ matrix.features }} -- --test-threads=1

      - name: Show sccache stats
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          else
            echo "sccache is disabled for this build."
          fi

  sdk_examples:
    name: Client SDK Examples
    runs-on: ubuntu-latest
    needs:
      - rust_fmt
    strategy:
      matrix:
        example: [ "hallo_world", "query" ]
    steps:
      - uses: actions/checkout@v5
      - name: Run Database
        run: docker run --network=host -v ${PWD}/misc:/misc -d ${{env.REGISTRY_IMAGE}}

      - name: AWS Credentials and Cargo Cache
        uses: ./.github/actions/aws-cargo-cache
        with:
          target: x86_64-unknown-linux-gnu
          profile: dev
          access-key-id: ${{ secrets.S3_CACHE_ACCESS_KEY }}
          secret-access-key: ${{ secrets.S3_CACHE_SECRET_KEY }}

      - name: Run Client SDK tests
        run: cargo run --example ${{matrix.example}}

      - name: Show sccache stats
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          else
            echo "sccache is disabled for this build."
          fi

  dry_publish:
    runs-on: ubuntu-latest
    name: Dry run publish
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - rust_fmt
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MINIMAL_RUST_VERSION }}
      - name: AWS Credentials and Cargo Cache
        uses: ./.github/actions/aws-cargo-cache
        with:
          target: x86_64-unknown-linux-gnu
          profile: publish
          access-key-id: ${{ secrets.S3_CACHE_ACCESS_KEY }}
          secret-access-key: ${{ secrets.S3_CACHE_SECRET_KEY }}
      - name: Dry run publish reduct-rs
        run: cargo publish --dry-run -p reduct-rs

      - name: Show sccache stats
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          else
            echo "sccache is disabled for this build."
          fi

  check_tag:
    runs-on: ubuntu-latest
    name: Check tag
    steps:
      - uses: actions/checkout@v5
      - name: Check tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cargo install cargo-get
          if [ "v$(cargo get package.version)" != "${GITHUB_REF#refs/*/}" ]; then
            echo "Tag does not match version in $PKG_NAME/Cargo.toml"
            exit 1
          fi

  publish_crate:
    runs-on: ubuntu-latest
    name: Publish crate
    needs:
      - sdk_tests
      - sdk_examples
      - check_tag # Only publish on tags
      - dry_publish
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MINIMAL_RUST_VERSION }}
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '3.x'
          repo-token: ${{ secrets.ACTION_GITHUB_TOKEN }}
      - name: Login
        run: |
          cargo login ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish reduct-rs
        run: cargo publish -p reduct-rs
